
services:
  kafka:
    image: confluentinc/cp-kafka:6.2.0
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE_KAFKA://kafka:9093, OUTSIDE://localhost:9093
      KAFKA_LISTENERS: INSIDE_KAFKA://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE_KAFKA:PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_NAME_INSIDE: INSIDE_KAFKA
      KAFKA_LISTENER_NAME_INTER_BROKER: INSIDE_KAFKA
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE_KAFKA
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9093:9093"
    depends_on:
      - zookeeper
    networks:
      - app_network

  zookeeper:
    image: zookeeper:3.7
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_LISTENER_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app_network

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB: order_management_db
    ports:
      - "5432:5432"
    networks:
      - app_network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - postgres
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
