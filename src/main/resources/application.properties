# Configuração do R2DBC para PostgreSQL
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/order_management_db
spring.r2dbc.username=usuarioApi_app
spring.r2dbc.password=123456

# Configuração do Consumer
spring.kafka.consumer.bootstrap-servers=kafka:9093
spring.kafka.consumer.group-id=order-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer  

# Configuração do Producer
spring.kafka.producer.bootstrap-servers=kafka:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer  
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer  

# Outras propriedades
spring.kafka.listener.missing-topics-fatal=false
